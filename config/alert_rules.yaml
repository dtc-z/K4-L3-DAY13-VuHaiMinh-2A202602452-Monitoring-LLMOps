alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000 ms
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602452
    runbook: docs/alerts.md#alert-1
  - name: HighRequestErrorRate
    severity: critical
    condition: request_failed / request_received > 2 percent
    duration: 2m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602452
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: tool_success true / all non-null tool_success events < 90 percent
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602452
    runbook: docs/alerts.md#alert-3
