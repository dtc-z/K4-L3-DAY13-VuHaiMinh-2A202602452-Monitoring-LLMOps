service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  error_budget_example:
    requests: 10000
    allowed_bad_requests: 50
    calculation: 10000 * 0.5 / 100
  note: Good requests are successful response_sent events with server-side latency_ms <= 3000 during the 28-day window. With a 99.5% target, the 0.5% error budget permits at most 50 bad requests out of 10,000; requests that fail or exceed the latency threshold consume budget.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
